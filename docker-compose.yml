# Sobe o sistema completo no seu computador ou num servidor:
#   docker compose up -d --build
# Depois abra http://localhost:8000
services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fenotipagem:fenotipagem@db:5432/fenotipagem}
    volumes: ["dados:/dados"]
    depends_on: [db]
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fenotipagem
      POSTGRES_PASSWORD: fenotipagem
      POSTGRES_DB: fenotipagem
    volumes: ["banco:/var/lib/postgresql/data"]
    restart: unless-stopped
volumes:
  dados:
  banco:
